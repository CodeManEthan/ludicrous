name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard library only — nothing to install.
      - name: Run the test suite
        run: python3 -m unittest discover

  rust:
    name: Rust core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The oracle fixtures are committed, so parity runs without Python.
      - name: Run the workspace tests
        run: cargo test --workspace

  artifacts:
    name: Committed builds match the source
    # A fixed image, not ubuntu-latest. The builds use rustc's bundled
    # rust-lld and a locked wasm-bindgen, so no runner tool shapes the output.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Installs the pinned rustc and wasm-bindgen-cli, rebuilds the wasm
      # bundle and bin/lud-batch, and fails unless they match the committed
      # files byte for byte.
      - name: Rebuild and compare
        run: core-rs/check-artifacts.sh
